[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-drive-os"
version = "1.1.0"
description = "Autonomous exFAT SSD Governance, 512KB Cluster Slack Optimization & SQLite FTS5 Instant Search Suite"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "DuongNAD", email = "smartdrive.os@proton.me" },
    { name = "SmartDrive Team", email = "smartdrive.os@proton.me" },
]
maintainers = [
    { name = "DuongNAD", email = "smartdrive.os@proton.me" },
]
keywords = [
    "ssd",
    "exfat",
    "cluster-slack",
    "fts5",
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "duongnad",
    "autonomous-agent",
    "ai-agents",
    "claude-code",
    "antigravity",
    "cursor-ide",
    "storage-audit",
    "junk-cleaner",
    "privacy",
    "zero-telemetry",
    "zero-dependency",
    "local-first",
    "air-gapped",
    "sha256-snapshot",
    "ntfs-junction",
    "cache-offload",
    "ssd-health",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Archiving",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
    "Topic :: Security",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Natural Language :: English",
    "Natural Language :: Vietnamese",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
smart-drive = "smart_drive.cli.main:main"
smart_drive = "smart_drive.cli.main:main"
smart-drive-manager = "smart_drive.cli.main:main"

[project.urls]
Homepage = "https://github.com/DuongNAD/smart-drive-os"
Documentation = "https://github.com/DuongNAD/smart-drive-os#readme"
Repository = "https://github.com/DuongNAD/smart-drive-os"
Issues = "https://github.com/DuongNAD/smart-drive-os/issues"
Changelog = "https://github.com/DuongNAD/smart-drive-os/releases"
Privacy = "https://github.com/DuongNAD/smart-drive-os/blob/main/PRIVACY.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["smart_drive*"]
exclude = ["tests*", "configs*", "launchers*"]

[tool.setuptools.package-data]
smart_drive = ["py.typed"]
